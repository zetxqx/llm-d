router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  inferencePool:
    failureMode: FailOpen

  epp:
    pluginsConfigFile: "t2i-vllmomni.yaml"
    pluginsCustomConfig:
      t2i-vllmomni.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - name: activeRequest
          type: active-request-scorer
        - name: maxScore
          type: max-score-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: activeRequest
          - pluginRef: maxScore
        # vLLM-Omni serves /metrics, but under a vllm_omni: prefix the default
        # extractor does not match, and no scorer here reads backend metrics.
        dataLayer:
          injectDefaults: false

  modelServers:
    matchLabels:
      llm-d.ai/guide: "diffusion-serving-t2i"
    protocol: http
