## Baseline arm for the session-control benchmark A/B.
## Layer on top of: recipes/router/base.values.yaml
##
## This is the llm-d optimized-baseline router profile (copied from
## guides/optimized-baseline/router/optimized-baseline.values.yaml) pointed at
## the session-control fleet: llm-d's recommended default routing — approximate
## prefix-cache affinity plus token-load balancing — with NO session awareness.
## The benchmark contrast is this profile (baseline) vs
## session-control.values.yaml (treatment, x-session-token pinning): the delta
## in cache-hit rate, TTFT, and sustainable concurrency isolates what session
## pinning adds over prefix-affinity routing alone.
##
## Swap arms by upgrading the same release with the other values file, THEN
## restarting EPP — the plugins ConfigMap is only read at startup (no hot
## reload), and helm won't roll the pod if only the ConfigMap changed:
##   helm upgrade ${GUIDE_NAME} ${ROUTER_STANDALONE_CHART} \
##     -f ${REPO_ROOT}/guides/recipes/router/base.values.yaml \
##     -f ${REPO_ROOT}/guides/${GUIDE_NAME}/router/optimized-baseline.values.yaml \
##     -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}
##   kubectl rollout restart deployment/${GUIDE_NAME}-epp -n ${NAMESPACE}
##
## peakPrefillThroughput CALIBRATED 2026-08-07: 68,228 tok/s, measured with
## guides/recipes/router/calibration (CHUNK_SIZE=8192 matching the engine's
## chunked_prefill_size, 20 samples, via the EPP) against this fleet
## (Qwen3-Coder-30B-A3B-Instruct-FP8, TP2 H100). The plugin default (15,928,
## dense Qwen3-32B) would underestimate prefill capacity 4.3×. Re-run the
## calibration after any change to model, TP, GPU type, or chunked-prefill
## size.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN

    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 68228
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "session-control"
