apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  # Fleet for the session-control benchmark: 4 × TP2 = 8 GPUs (2 full H100
  # nodes). Routing decisions stay observable (a wrong pick lands on one of
  # three other pods) and the extra replica moves the KV-capacity knee to
  # ~c64, making the c48-c80 sweep range measurable. The experiment floor is
  # 3 replicas if the spot pool cannot fit 2 full nodes.
  replicas: 4
  # Recreate, not RollingUpdate: the H100 spot pool runs near-full, so a
  # rolling update would need 2 spare GPUs per surge pod that usually don't
  # exist — old pods must release their GPUs before new ones can schedule.
  # The fleet is an experiment stack; a full bounce is acceptable.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: modelserver
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            # Qwen3-Coder-30B-A3B: 262K-native-context MoE (3.3B active) with
            # standard GQA full attention — the weka-trace replay workload
            # (median main-agent ISL ~195K, p95 >395K) does not fit Qwen3-32B's
            # 32K/131K window, and the 2026 hybrid-attention small models break
            # token-indexed radix semantics. FP8 weights ~30GB -> ~15GB/GPU at
            # TP2, leaving ~110GB KV pool per replica.
            - "--model-path=Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=2"
            # Full native window; the -256k weka corpus builds are filtered to
            # fit exactly this.
            - "--context-length=262144"
            # FP8 KV halves per-token cost (96KB -> 48KB): a 195K session holds
            # ~9.4GB, so each TP2 replica retains ~11-17 resident sessions and
            # the 4-replica fleet (~44-68 sessions) enters cache-pressure
            # territory around c64 — the regime where session-affinity routing
            # becomes observable.
            - "--kv-cache-dtype=fp8_e4m3"
            # 0.88 (down from 0.9): headroom for 262K chunked-prefill
            # activation spikes.
            - "--mem-fraction-static=0.88"
            - "--enable-metrics"
            # Session control (llm-d-router#2003): SGLang serves /open_session
            # and /close_session unconditionally — dedicated-slot sessions need
            # no server flag. Session-reference-aware radix mode (sglang#29173,
            # v0.5.17+; tag overridden in this guide's base kustomization) runs
            # on UnifiedRadixCache: eviction consumes unreferenced KV before
            # session-referenced KV, and /close_session dereferences a
            # session's KV instead of freeing it. Requires the
            # SGLANG_ENABLE_UNIFIED_RADIX_TREE env below or startup fails; the
            # unified tree ignores --radix-eviction-policy, so the old
            # priority-policy flag is gone.
            - "--enable-session-radix-cache"
            # Populate usage.prompt_tokens_details.cached_tokens on the OpenAI
            # endpoints (off by default upstream); the native /generate path
            # reports cached_tokens in meta_info regardless.
            - "--enable-cache-report"
          env:
            # Required by --enable-session-radix-cache since sglang#29173: the
            # session-ref tracker lives in UnifiedRadixCache, and the unified
            # tree is still env-gated (not a server arg) as of v0.5.17.
            - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            limits:
              cpu: '16'
              memory: 128Gi
              nvidia.com/gpu: 2
            requests:
              cpu: '8'
              memory: 96Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            # SGLang image did not set $HOME, so under a restricted SecurityContext
            # (random non-root UID, e.g. OpenShift) ~/ resolves to the non-writable
            # "/". Back the cache dirs SGLang writes at startup with emptyDirs:
            #   /.cache  — HF model downloads, FlashInfer JIT, Torch compile cache
            #   /.triton — Triton kernel autotune cache
            - mountPath: /.cache
              name: sglang-cache
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: sglang-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
