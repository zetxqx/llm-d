apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: session-control-gpu-sglang-

components:
  - ../../../../../recipes/modelserver/components/images/gpu-sglang

labels:
  - pairs:
      llm-d.ai/guide: session-control
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-sglang.yaml

# Session-tagged radix cache (sglang#27058, --enable-session-radix-cache in
# patch-sglang.yaml) first shipped in v0.5.15 — override the recipes
# component's pinned v0.5.13.post1.
images:
  - name: docker.io/lmsysorg/sglang
    newTag: v0.5.15.post1
