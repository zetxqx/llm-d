apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: session-control-gpu-sglang-

components:
  - ../../../../../recipes/modelserver/components/images/gpu-sglang/release

labels:
  - pairs:
      llm-d.ai/guide: session-control
      llm-d.ai/model: Qwen3-Coder-30B-A3B-FP8
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-sglang.yaml

# Session-reference-aware radix cache (sglang#29173, --enable-session-radix-cache
# in patch-sglang.yaml on UnifiedRadixCache) first shipped in v0.5.17 — override
# the recipes release component's pinned v0.5.16.
images:
  - name: docker.io/lmsysorg/sglang
    newTag: v0.5.17
