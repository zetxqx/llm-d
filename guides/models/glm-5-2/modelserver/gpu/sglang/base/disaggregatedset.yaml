# GLM-5.2-FP8 on SGLang with the Rust frontend, P/D disaggregated, wide EP.
#
# Every attention-DP rank runs its own embedded Rust HTTP listener, so each
# rank is a separate llm-d endpoint (pod IP x port), exactly like the vLLM
# multi-port DP layout:
#
#   prefill pod:  SGLang rank r listens on 8000+r      (r = 0..7, node local)
#   decode pod:   routing sidecar rank r on 8000+r  ->  SGLang rank r on 8200+r
#
# Requests use the OpenAI /v1/chat/completions and /v1/completions routes or
# SGLang's native /generate API (text or input_ids). The sidecar
# injects bootstrap_host/bootstrap_port/bootstrap_room and sends the same body
# to the chosen prefill rank and to its local decode rank.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  # Keep this name at 33 characters or fewer: LWS labels every pod with
  # <name>-0-<8 char hash>-<role>-<10 char hash>, and labels are limited to
  # 63 bytes. A longer name makes the StatefulSets fail to create pods.
  name: wide-ep-sglang-glm-5-2
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/guide: wide-ep
    llm-d.ai/engine-type: sglang
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
spec:
  roles:
    - name: prefill
      metadata:
        labels:
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/guide: wide-ep
          llm-d.ai/engine-type: sglang
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/role: prefill
      spec:
        replicas: ${PREFILL_REPLICAS}
        # Tear down the old group before creating the new one on updates. The
        # DisaggregatedSet default (maxSurge=1, maxUnavailable=0) would require a
        # full spare copy of the role to schedule, which deadlocks rollouts on
        # clusters sized for exactly one copy.
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: ${PREFILL_SIZE}
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: "wide-ep"
                llm-d.ai/engine-type: "sglang"
                llm-d.ai/accelerator-variant: "gpu"
                llm-d.ai/accelerator-vendor: "nvidia"
                llm-d.ai/model: GLM-5.2-FP8
                llm-d.ai/role: prefill
            spec:
              serviceAccountName: sglang-glm-5-2
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 256Gi
                - name: hf-cache
                  hostPath:
                    path: /mnt/local/hf-cache
                    type: DirectoryOrCreate
                - name: jit-cache
                  hostPath:
                    path: /mnt/local/jit-cache
                    type: DirectoryOrCreate
              containers:
                - name: sglang
                  image: REPLACE_MODEL_SERVER_IMAGE
                  securityContext:
                    capabilities:
                      add:
                        - IPC_LOCK
                        - SYS_RAWIO
                    runAsGroup: 0
                    runAsUser: 0
                  imagePullPolicy: Always
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      find /dev/shm -type f -delete

                      #################
                      # RUN SGLang GLM-5.2-FP8 prefill worker
                      #################

                      # DEP layout over every GPU in the group. SGLang's --tp-size
                      # is the size of the GPU group that holds one copy of the
                      # model, not the attention TP size. Inside that group,
                      # attention runs data parallel with one rank per GPU
                      # (--attn-dp-size, so attention TP is 1) and the experts are
                      # split across all GPUs (--ep-size). vLLM spells the same
                      # layout --tensor-parallel-size 1 --data-parallel-size N
                      # --enable-expert-parallel.
                      DP_SIZE=$(( LWS_GROUP_SIZE * DP_SIZE_LOCAL ))

                      # SGLang rejects DeepEP v2 for the MTP draft layer, so the
                      # draft runs its MoE without an all-to-all backend.
                      MTP_ARGS=""
                      if [ "${ENABLE_MTP:-1}" = "1" ]; then
                        MTP_ARGS="--speculative-algorithm EAGLE --speculative-num-steps ${MTP_NUM_STEPS:-3} --speculative-eagle-topk 1 --speculative-num-draft-tokens ${MTP_NUM_DRAFT_TOKENS:-4} --speculative-moe-a2a-backend none"
                      fi

                      # SGLang splits --chunked-prefill-size and
                      # --max-running-requests evenly across the attention-DP
                      # ranks, so scale the per-rank budgets up.
                      CHUNKED_PREFILL_SIZE=$(( ${PREFILL_CHUNK_TOKENS_PER_RANK:-8192} * DP_SIZE ))
                      MAX_RUNNING_REQUESTS=$(( ${PREFILL_MAX_RUNNING_REQUESTS_PER_RANK:-64} * DP_SIZE ))

                      # GLM-5.2 ships its chat template as chat_template.jinja,
                      # which the Rust frontend does not read from the model
                      # directory, so /v1/chat/completions needs it passed in.
                      CHAT_TEMPLATE=$(python3 -c "from huggingface_hub import hf_hub_download; print(hf_hub_download('zai-org/GLM-5.2-FP8', 'chat_template.jinja'))")

                      # P/D bootstrap with the Rust frontend: the bootstrap
                      # registry is served by the rank-0 listener (port 8000) of
                      # every prefill pod, not by a separate bootstrap server.
                      # --disaggregation-bootstrap-port must name that port, and
                      # the decode sidecar injects the same port
                      # (SGLANG_BOOTSTRAP_PORT).
                      #
                      # --load-balance-method does no balancing here: each Rust
                      # listener sends its requests straight to its own rank. The
                      # value only selects how decode finds the prefill rank. The
                      # P/D default follow_bootstrap_room assumes the rank is
                      # room % dp_size and fails the request otherwise; any other
                      # value makes the prefill rank register the room it served
                      # so decode can look it up, which lets the EPP pick any rank.
                      #
                      # SGLang defaults to a bfloat16 KV cache for DSA models on
                      # Hopper (fp8 only on Blackwell); fp8_e4m3 nearly doubles
                      # the KV capacity. flashmla_kv is the DSA backend SGLang
                      # picks for fp8 on Hopper; it is pinned so the kernels do
                      # not change with SGLang defaults.
                      #
                      # DeepEP v2 (ElasticBuffer) moves tokens over NCCL GIN
                      # instead of NVSHMEM. Its hybrid mode is the one that can
                      # span nodes; the direct mode is NVLink only.
                      exec python3 -m sglang.launch_server \
                        --model-path zai-org/GLM-5.2-FP8 \
                        --trust-remote-code \
                        --host 0.0.0.0 \
                        --port 8000 \
                        --nnodes ${LWS_GROUP_SIZE} \
                        --node-rank ${LWS_WORKER_INDEX:-0} \
                        --dist-init-addr ${LWS_LEADER_ADDRESS}:5757 \
                        --tp-size ${DP_SIZE} \
                        --attn-dp-size ${DP_SIZE} \
                        --ep-size ${DP_SIZE} \
                        --kv-cache-dtype fp8_e4m3 \
                        --dsa-prefill-backend flashmla_kv \
                        --dsa-decode-backend flashmla_kv \
                        --moe-a2a-backend deepep_v2 \
                        --deepep-v2-mode hybrid \
                        --moe-dense-tp-size 1 \
                        --enable-dp-lm-head \
                        --disaggregation-mode prefill \
                        --disaggregation-transfer-backend ${DISAGG_TRANSFER_BACKEND:-nixl} \
                        --disaggregation-bootstrap-port 8000 \
                        --load-balance-method round_robin \
                        --mem-fraction-static ${PREFILL_MEM_FRACTION_STATIC:-0.85} \
                        --chunked-prefill-size ${CHUNKED_PREFILL_SIZE} \
                        --max-running-requests ${MAX_RUNNING_REQUESTS} \
                        ${CONTEXT_LENGTH:+--context-length ${CONTEXT_LENGTH}} \
                        --chat-template ${CHAT_TEMPLATE} \
                        --reasoning-parser glm45 \
                        --tool-call-parser glm47 \
                        --watchdog-timeout 3600 \
                        --dist-timeout 3600 \
                        $MTP_ARGS
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HOME
                      value: /mnt/hf-cache
                    # Serve from the embedded Rust frontend: one HTTP listener
                    # per attention-DP rank instead of the single Python frontend.
                    - name: SGLANG_RUST_SERVER
                      value: "1"
                    # Fail fast if the image lacks the prebuilt Rust extension
                    # instead of compiling it inside the container.
                    - name: SGLANG_RUST_BUILD_MODE
                      value: never
                    # Keep /health a plain 200 after startup warmup. The decode
                    # side heartbeats the prefill bootstrap address (port 8000)
                    # with GET /health every 5s and drops the prefill, failing
                    # in-flight transfers, after 2 misses; the default deep probe
                    # can take up to 20s while a prefill batch is running.
                    - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
                      value: "false"
                    - name: DP_SIZE_LOCAL
                      value: "8"
                    - name: ENABLE_MTP
                      value: "1"
                    - name: MTP_NUM_STEPS
                      value: "3"
                    - name: MTP_NUM_DRAFT_TOKENS
                      value: "4"
                    - name: PREFILL_MEM_FRACTION_STATIC
                      value: "0.85"
                    - name: PREFILL_CHUNK_TOKENS_PER_RANK
                      value: "8192"
                    - name: PREFILL_MAX_RUNNING_REQUESTS_PER_RANK
                      value: "64"
                    # DeepEP v2 per-rank dispatch buffer. SGLang refuses to start
                    # unless it holds a full per-rank prefill chunk, so keep it at
                    # least PREFILL_CHUNK_TOKENS_PER_RANK.
                    - name: SGLANG_DEEPEP_V2_NUM_MAX_DISPATCH_TOKENS_PER_RANK
                      value: "8192"
                    - name: CONTEXT_LENGTH
                      value: ""
                    - name: DISAGG_TRANSFER_BACKEND
                      value: nixl
                    - name: NVIDIA_GDRCOPY
                      value: enabled
                    - name: GLOO_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                  ports:
                    - containerPort: 8000
                      name: dp0
                      protocol: TCP
                    - containerPort: 8001
                      name: dp1
                      protocol: TCP
                    - containerPort: 8002
                      name: dp2
                      protocol: TCP
                    - containerPort: 8003
                      name: dp3
                      protocol: TCP
                    - containerPort: 8004
                      name: dp4
                      protocol: TCP
                    - containerPort: 8005
                      name: dp5
                      protocol: TCP
                    - containerPort: 8006
                      name: dp6
                      protocol: TCP
                    - containerPort: 8007
                      name: dp7
                      protocol: TCP
                  # Probes. Every Rust listener answers /health with 503 until
                  # its own startup warmup (a one-token generation on its rank)
                  # succeeds, then with a plain 200 (see
                  # SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION above).
                  startupProbe:
                    httpGet:
                      path: /health
                      port: dp0
                    initialDelaySeconds: 0
                    periodSeconds: 1
                    timeoutSeconds: 5
                    failureThreshold: 2700
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: dp0
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: dp0
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  resources:
                    limits:
                      memory: 512Gi
                      nvidia.com/gpu: "8"
                    requests:
                      cpu: 32
                      memory: 512Gi
                      nvidia.com/gpu: "8"
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: hf-cache
                      mountPath: /mnt/hf-cache
                    # FlashInfer, DeepGEMM, and Triton JIT caches.
                    - name: jit-cache
                      mountPath: /root/.cache
    - name: decode
      metadata:
        labels:
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/guide: wide-ep
          llm-d.ai/engine-type: sglang
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/role: decode
      spec:
        replicas: ${DECODE_REPLICAS}
        # See the prefill role above: avoid surge-based rollouts that need a
        # spare copy of the role's GPUs.
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: ${DECODE_SIZE}
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: "wide-ep"
                llm-d.ai/engine-type: "sglang"
                llm-d.ai/accelerator-variant: "gpu"
                llm-d.ai/accelerator-vendor: "nvidia"
                llm-d.ai/model: GLM-5.2-FP8
                llm-d.ai/role: decode
            spec:
              serviceAccountName: sglang-glm-5-2
              initContainers:
                - name: routing-proxy
                  args:
                    - --port=8000
                    - --model-server-port=8200
                    - --data-parallel-size=8
                    - --kv-connector=sglang
                    - --zap-log-level=1
                    - --secure-proxy=false
                    - --enable-prefiller-sampling
                  env:
                    # Injected as bootstrap_port on both P/D legs. Must be the
                    # prefill pods' rank-0 Rust listener port, which hosts the
                    # bootstrap registry (see the prefill role).
                    - name: SGLANG_BOOTSTRAP_PORT
                      value: "8000"
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  imagePullPolicy: Always
                  ports:
                    - containerPort: 8000
                      name: rank0
                      protocol: TCP
                    - containerPort: 8001
                      name: rank1
                      protocol: TCP
                    - containerPort: 8002
                      name: rank2
                      protocol: TCP
                    - containerPort: 8003
                      name: rank3
                      protocol: TCP
                    - containerPort: 8004
                      name: rank4
                      protocol: TCP
                    - containerPort: 8005
                      name: rank5
                      protocol: TCP
                    - containerPort: 8006
                      name: rank6
                      protocol: TCP
                    - containerPort: 8007
                      name: rank7
                      protocol: TCP
                  restartPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 256Gi
                - name: hf-cache
                  hostPath:
                    path: /mnt/local/hf-cache
                    type: DirectoryOrCreate
                - name: jit-cache
                  hostPath:
                    path: /mnt/local/jit-cache
                    type: DirectoryOrCreate
              containers:
                - name: sglang
                  image: REPLACE_MODEL_SERVER_IMAGE
                  securityContext:
                    capabilities:
                      add:
                        - IPC_LOCK
                        - SYS_RAWIO
                    runAsGroup: 0
                    runAsUser: 0
                  imagePullPolicy: Always
                  command:
                    - /bin/bash
                    - -c
                  args:
                    - |-
                      find /dev/shm -type f -delete

                      #################
                      # RUN SGLang GLM-5.2-FP8 decode worker
                      #################

                      # Same DEP layout as the prefill role: --tp-size,
                      # --attn-dp-size and --ep-size all equal the group's GPU
                      # count, so attention TP is 1.
                      DP_SIZE=$(( LWS_GROUP_SIZE * DP_SIZE_LOCAL ))

                      # See the prefill role: the MTP draft cannot use DeepEP v2.
                      MTP_ARGS=""
                      if [ "${ENABLE_MTP:-1}" = "1" ]; then
                        MTP_ARGS="--speculative-algorithm EAGLE --speculative-num-steps ${MTP_NUM_STEPS:-3} --speculative-eagle-topk 1 --speculative-num-draft-tokens ${MTP_NUM_DRAFT_TOKENS:-4} --speculative-moe-a2a-backend none"
                      fi

                      # DeepEP v2 dispatches at most
                      # SGLANG_DEEPEP_V2_NUM_MAX_DISPATCH_TOKENS_PER_RANK tokens per
                      # rank per step: running requests x draft tokens with MTP.
                      # SGLang splits --max-running-requests across the attention-DP
                      # ranks, so pass per-rank x DP; keep the per-rank value and
                      # the CUDA graph capture sizes within that budget.
                      MAX_RUNNING_REQUESTS=$(( ${DECODE_MAX_RUNNING_REQUESTS_PER_RANK:-32} * DP_SIZE ))
                      # See the prefill role: pass GLM-5.2's chat template.
                      CHAT_TEMPLATE=$(python3 -c "from huggingface_hub import hf_hub_download; print(hf_hub_download('zai-org/GLM-5.2-FP8', 'chat_template.jinja'))")
                      # The KV cache dtype, DSA backends and DeepEP v2 mode match
                      # the prefill role; hybrid mode is required across nodes.
                      exec python3 -m sglang.launch_server \
                        --model-path zai-org/GLM-5.2-FP8 \
                        --trust-remote-code \
                        --host 0.0.0.0 \
                        --port 8200 \
                        --nnodes ${LWS_GROUP_SIZE} \
                        --node-rank ${LWS_WORKER_INDEX:-0} \
                        --dist-init-addr ${LWS_LEADER_ADDRESS}:5757 \
                        --tp-size ${DP_SIZE} \
                        --attn-dp-size ${DP_SIZE} \
                        --ep-size ${DP_SIZE} \
                        --kv-cache-dtype fp8_e4m3 \
                        --dsa-prefill-backend flashmla_kv \
                        --dsa-decode-backend flashmla_kv \
                        --moe-a2a-backend deepep_v2 \
                        --deepep-v2-mode hybrid \
                        --moe-dense-tp-size 1 \
                        --enable-dp-lm-head \
                        --disaggregation-mode decode \
                        --disaggregation-transfer-backend ${DISAGG_TRANSFER_BACKEND:-nixl} \
                        --mem-fraction-static ${DECODE_MEM_FRACTION_STATIC:-0.85} \
                        --max-running-requests ${MAX_RUNNING_REQUESTS} \
                        --cuda-graph-max-bs-decode ${DECODE_CUDA_GRAPH_MAX_BS:-32} \
                        ${CONTEXT_LENGTH:+--context-length ${CONTEXT_LENGTH}} \
                        --chat-template ${CHAT_TEMPLATE} \
                        --reasoning-parser glm45 \
                        --tool-call-parser glm47 \
                        --watchdog-timeout 3600 \
                        --dist-timeout 3600 \
                        $MTP_ARGS
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HOME
                      value: /mnt/hf-cache
                    - name: SGLANG_RUST_SERVER
                      value: "1"
                    - name: SGLANG_RUST_BUILD_MODE
                      value: never
                    # Keep /health a plain 200 after startup warmup. The decode
                    # side heartbeats the prefill bootstrap address (port 8000)
                    # with GET /health every 5s and drops the prefill, failing
                    # in-flight transfers, after 2 misses; the default deep probe
                    # can take up to 20s while a prefill batch is running.
                    - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
                      value: "false"
                    - name: SGLANG_DEEPEP_V2_NUM_MAX_DISPATCH_TOKENS_PER_RANK
                      value: "128"
                    - name: DP_SIZE_LOCAL
                      value: "8"
                    - name: ENABLE_MTP
                      value: "1"
                    - name: MTP_NUM_STEPS
                      value: "3"
                    - name: MTP_NUM_DRAFT_TOKENS
                      value: "4"
                    - name: DECODE_MEM_FRACTION_STATIC
                      value: "0.85"
                    - name: DECODE_MAX_RUNNING_REQUESTS_PER_RANK
                      value: "32"
                    - name: DECODE_CUDA_GRAPH_MAX_BS
                      value: "32"
                    - name: CONTEXT_LENGTH
                      value: ""
                    - name: DISAGG_TRANSFER_BACKEND
                      value: nixl
                    - name: NVIDIA_GDRCOPY
                      value: enabled
                    - name: GLOO_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                  ports:
                    - containerPort: 8200
                      name: sglang-rank0
                      protocol: TCP
                    - containerPort: 8201
                      name: sglang-rank1
                      protocol: TCP
                    - containerPort: 8202
                      name: sglang-rank2
                      protocol: TCP
                    - containerPort: 8203
                      name: sglang-rank3
                      protocol: TCP
                    - containerPort: 8204
                      name: sglang-rank4
                      protocol: TCP
                    - containerPort: 8205
                      name: sglang-rank5
                      protocol: TCP
                    - containerPort: 8206
                      name: sglang-rank6
                      protocol: TCP
                    - containerPort: 8207
                      name: sglang-rank7
                      protocol: TCP
                  # Probes. Every Rust listener answers /health with 503 until
                  # its own startup warmup (a one-token generation on its rank)
                  # succeeds, then with a plain 200 (see
                  # SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION above).
                  startupProbe:
                    httpGet:
                      path: /health
                      port: sglang-rank0
                    initialDelaySeconds: 0
                    periodSeconds: 1
                    timeoutSeconds: 5
                    failureThreshold: 2700
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: sglang-rank0
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: sglang-rank0
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  resources:
                    limits:
                      memory: 512Gi
                      nvidia.com/gpu: "8"
                    requests:
                      cpu: 32
                      memory: 512Gi
                      nvidia.com/gpu: "8"
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: hf-cache
                      mountPath: /mnt/hf-cache
                    - name: jit-cache
                      mountPath: /root/.cache
